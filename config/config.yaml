# =============================================================================
# Google Earth 不動産・リスク情報 自動マッピングシステム 設定ファイル
# =============================================================================
# 設計図 ③ 自動処理プログラムの動作を制御する設定。
# サイト仕様変更時は基本的にこのファイルだけを修正すれば対応可能なように
# URL / クエリ / セレクタを外出ししている。
# =============================================================================

# ---------------------------------------------------------------------------
# ① 地価公示データ (国土交通省)
# ---------------------------------------------------------------------------
# 「不動産情報ライブラリ API」(国交省) または 旧 Webland API を想定。
# 2024年4月以降は不動産情報ライブラリ API V4 系が標準。
# サイト仕様変更時は endpoint / params / response_format を更新する。
chika:
  enabled: true
  # 不動産情報ライブラリ API: 地価公示・地価調査データ取得
  endpoint: "https://www.reinfolib.mlit.go.jp/ex-api/external/XIT001"
  # API キーが必要な場合は環境変数 REINFOLIB_API_KEY から読み込む
  api_key_env: "REINFOLIB_API_KEY"
  # 取得対象 (年・都道府県コード)。空にすると全都道府県を順次取得
  year: 2025
  prefecture_codes:
    - "13"   # 東京都
    - "14"   # 神奈川県
  # フォールバック: APIが取れない場合に使う 国土数値情報ダウンロードURL (任意)
  fallback_csv_urls: []
  # 出力ファイル名 (設計図 ④ chika_latest.kml)
  output_filename: "chika_latest.kml"

# ---------------------------------------------------------------------------
# ② ハザードマップデータ (国土数値情報 / 自治体オープンデータ)
# ---------------------------------------------------------------------------
# 国土数値情報ダウンロードサイトから 洪水浸水想定区域・土砂災害警戒区域などを取得。
# 各レイヤーは GeoJSON / Shape / KML 等。ここでは GeoJSON を想定。
hazard:
  enabled: true
  layers:
    - name: "洪水浸水想定区域"
      # 公開データの GeoJSON URL を指定 (例: 国土数値情報 A31)
      url: "https://nlftp.mlit.go.jp/ksj/gml/data/A31/A31-12/A31-12_13_GML.zip"
      format: "auto_zip"   # GeoJSON入りなら自動採用、無ければ Shapefile として読込
      style:
        color: "#3399FF"
        opacity: 0.5
    - name: "土砂災害警戒区域"
      url: "https://nlftp.mlit.go.jp/ksj/gml/data/A33/A33-19/A33-19_13_GML.zip"
      format: "auto_zip"   # GeoJSON入りなら自動採用、無ければ Shapefile として読込
      style:
        color: "#FF6633"
        opacity: 0.5
  output_filename: "hazard_latest.kml"

# ---------------------------------------------------------------------------
# 出力先 (設計図 ④ ローカルPC内特定フォルダ)
# ---------------------------------------------------------------------------
# Google Earth Pro のネットワークリンクが見に行くフォルダ。
# Windows例: C:/SNS_Manager/output  Mac例: /Users/<user>/SNS_Manager/output
output:
  directory: "./output"
  # KMLとKMZどちらを書き出すか (kmz は zip圧縮版、容量が小さい)
  format: "kml"   # "kml" or "kmz"

# ---------------------------------------------------------------------------
# HTTP / リトライ設定
# ---------------------------------------------------------------------------
http:
  timeout_seconds: 60
  retry_count: 4
  # 初回 2s, 4s, 8s, 16s の指数バックオフ
  retry_backoff_seconds: 2
  user_agent: "SNS-Manager-AutoMapper/1.0 (+https://example.com)"

# ---------------------------------------------------------------------------
# 通知 (エラー監視)
# ---------------------------------------------------------------------------
# 取得失敗・変換失敗時にメール通知。SMTP情報は環境変数で渡す想定。
notify:
  enabled: false
  email:
    smtp_host_env: "SMTP_HOST"
    smtp_port_env: "SMTP_PORT"
    smtp_user_env: "SMTP_USER"
    smtp_password_env: "SMTP_PASSWORD"
    from_addr: "noreply@example.com"
    to_addrs:
      - "admin@example.com"
  # 通知に使用するログレベル (ERROR以上で送信)
  level: "ERROR"

# ---------------------------------------------------------------------------
# ロギング
# ---------------------------------------------------------------------------
logging:
  directory: "./logs"
  level: "INFO"
  # ログを何日間保持するか (古いログは自動削除)
  retention_days: 30
